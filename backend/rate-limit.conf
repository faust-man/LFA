# Подключается в контейнер owasp/modsecurity-crs (см. docker-compose.yml)
# как дополнительный конфиг реверс-прокси перед backend.

# Anti-DDoS: не более 10 запросов/сек с одного IP, всплеск до 20
limit_req_zone $binary_remote_addr zone=api_general:10m rate=10r/s;

# Отдельная, более строгая зона для входа — защита от брутфорса паролей
limit_req_zone $binary_remote_addr zone=api_login:10m rate=1r/s;

# Ограничение числа одновременных соединений с одного IP
limit_conn_zone $binary_remote_addr zone=conn_limit:10m;

server {
    limit_req zone=api_general burst=20 nodelay;
    limit_conn conn_limit 20;

    # По умолчанию у nginx лимит тела запроса 1m — этого мало для загрузки
    # фото (см. MAX_UPLOAD_BYTES в backend/media.py и MODSEC_REQ_BODY_LIMIT
    # в docker-compose.yml — оба должны совпадать по порядку величины).
    client_max_body_size 16m;

    location /api/auth/login {
        limit_req zone=api_login burst=3 nodelay;
    }

    location /api/auth/register {
        limit_req zone=api_login burst=3 nodelay;
    }
}
