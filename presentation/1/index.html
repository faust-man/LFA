<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>1. Animal Map</title>
    <link rel="stylesheet" href="../slides.css" />
  </head>
  <body>
    <main class="slide">
      <div class="eyebrow">Сервис поиска животных</div>
      <div class="hero">
        <div>
          <span class="pill">Учебный проект / 2026</span>
          <h1 style="margin-top: 30px">
            Animal<br /><span class="accent">Map.</span>
          </h1>
          <p>Помогаем людям и питомцам<br />снова найти друг друга.</p>
          <!-- Укажите название учебного заведения здесь. -->
          <div class="school">Название учебного заведения</div>
        </div>
        <div class="map-art">
          <svg viewBox="0 0 600 520" aria-hidden="true">
            <defs>
              <pattern
                id="grid"
                width="50"
                height="50"
                patternUnits="userSpaceOnUse"
              >
                <path
                  d="M50 0H0v50"
                  fill="none"
                  stroke="#bacbb0"
                  stroke-width="1"
                />
              </pattern>
            </defs>
            <rect width="600" height="520" fill="url(#grid)" />
            <path
              d="M-20 380Q160 190 300 280T630 120"
              stroke="#b8cddd"
              stroke-width="48"
              fill="none"
            />
            <path
              d="m40 0 80 130 160 25 100-65 220 50M0 220l170-20 80 190 160-10 210 100M340 0l-70 155 80 150-100 230"
              stroke="#f7f8ee"
              stroke-width="19"
              fill="none"
            />
            <g fill="#c6d8a9">
              <rect x="150" y="47" width="92" height="60" rx="15" />
              <rect x="370" y="196" width="118" height="80" rx="20" />
              <rect x="70" y="295" width="75" height="55" rx="13" />
            </g>
            <g transform="translate(240 110)">
              <path
                d="M0 44C0-16 100-16 100 44c0 34-50 88-50 88S0 78 0 44"
                fill="#183d33"
              />
              <g transform="translate(25 17) scale(1.25)" fill="#d0e88c">
                <ellipse cx="20" cy="27" rx="11" ry="9" />
                <ellipse cx="7" cy="14" rx="4" ry="6" />
                <ellipse cx="16" cy="7" rx="4" ry="6" />
                <ellipse cx="27" cy="8" rx="4" ry="6" />
                <ellipse cx="35" cy="17" rx="4" ry="6" />
              </g>
            </g>
            <g fill="#789748" stroke="#f4f5ed" stroke-width="5">
              <circle cx="130" cy="238" r="15" />
              <circle cx="436" cy="132" r="15" />
              <circle cx="388" cy="354" r="15" />
            </g>
            <circle
              cx="290"
              cy="250"
              r="92"
              stroke="#789748"
              fill="none"
              opacity=".5"
              stroke-dasharray="6 8"
            />
          </svg>
          <div class="map-label">Каждая отметка — шанс вернуться домой.</div>
        </div>
      </div>
      <footer class="footer">
        <span>ANIMAL MAP · Знакомство</span><span>01 / 07</span>
      </footer>
    </main>
  </body>
</html>
