<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>2. Animal Map</title>
    <link rel="stylesheet" href="../slides.css" />
  </head>
  <body>
    <main class="slide">
      <div class="eyebrow">Люди за проектом</div>
      <h2>Четыре роли. Одна общая цель.</h2>
      <p class="intro">Команда, которая превращает идею в работающий сервис.</p>
      <div class="team">
        <article class="member">
          <label
            class="photo"
            data-photo="1"
            aria-label="Загрузить фото участника 1"
            ><svg viewBox="0 0 100 100" aria-hidden="true">
              <circle cx="50" cy="32" r="17" />
              <path d="M18 88v-9c0-32 64-32 64 0v9" /></svg
            ><span>ДОБАВИТЬ ФОТО</span
            ><input hidden type="file" accept="image/*"
          /></label>
          <h3
            class="edit"
            contenteditable="true"
            role="textbox"
            aria-label="ФИО участника 1"
            data-save="name-1"
            data-placeholder="Фамилия Имя Отчество"
          ></h3>
          <p
            class="edit"
            contenteditable="true"
            role="textbox"
            aria-label="Роль участника 1"
            data-save="role-1"
            data-placeholder="Роль в проекте и несколько слов о вкладе"
          ></p>
          <div class="index">УЧАСТНИК / 01</div>
        </article>
        <article class="member">
          <label
            class="photo"
            data-photo="2"
            aria-label="Загрузить фото участника 2"
            ><svg viewBox="0 0 100 100" aria-hidden="true">
              <circle cx="50" cy="32" r="17" />

            ><span>ДОБАВИТЬ ФОТО</span
            ><input hidden type="file" accept="image/*"
          /></label>
          <h3
            class="edit"
            contenteditable="true"
            role="textbox"
            aria-label="ФИО участника 2"
            data-save="name-2"
            data-placeholder="Фамилия Имя Отчество"
          ></h3>
          <p
            class="edit"
            contenteditable="true"
            role="textbox"
            aria-label="Роль участника 2"
            data-save="role-2"
            data-placeholder="Роль в проекте и несколько слов о вкладе"
          ></p>
          <div class="index">УЧАСТНИК / 02</div>
        </article>
        <article class="member">
          <label
            class="photo"
            data-photo="3"
            aria-label="Загрузить фото участника 3"
            ><svg viewBox="0 0 100 100" aria-hidden="true">
              <circle cx="50" cy="32" r="17" />
              <path d="M18 88v-9c0-32 64-32 64 0v9" /></svg
            ><span>ДОБАВИТЬ ФОТО</span
            ><input hidden type="file" accept="image/*"
          /></label>
          <h3
            class="edit"
            contenteditable="true"
            role="textbox"
            aria-label="ФИО участника 3"
            data-save="name-3"
            data-placeholder="Фамилия Имя Отчество"
          ></h3>
          <p
            class="edit"
            contenteditable="true"
            role="textbox"
            aria-label="Роль участника 3"
            data-save="role-3"
            data-placeholder="Роль в проекте и несколько слов о вкладе"
          ></p>
          <div class="index">УЧАСТНИК / 03</div>
        </article>
        <article class="member">
          <label
            class="photo"
            data-photo="4"
            aria-label="Загрузить фото участника 4"
            ><svg viewBox="0 0 100 100" aria-hidden="true">
              <circle cx="50" cy="32" r="17" />
              <path d="M18 88v-9c0-32 64-32 64 0v9" /></svg
            ><span>ДОБАВИТЬ ФОТО</span
            ><input hidden type="file" accept="image/*"

          <h3

            aria-label="ФИО участника 4"
            data-save="name-4"
            data-placeholder="Фамилия Имя Отчество"
          ></h3>
          <p
            class="edit"
            contenteditable="true"
            role="textbox"
            aria-label="Роль участника 4"
            data-save="role-4"
            data-placeholder="Роль в проекте и несколько слов о вкладе"
          ></p>
          <div class="index">УЧАСТНИК / 04</div>
        </article>
      </div>
      <div class="small" style="margin-top: 20px">
        Фото, ФИО и роли можно заполнить прямо здесь. Данные сохраняются в этом
        браузере.
      </div>
      <footer class="footer">
        <span>ANIMAL MAP · Команда</span><span>02 / 07</span>
      </footer>
    </main>
    <script src="../edit.js"></script>
