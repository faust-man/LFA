services:
  database:
    image: postgres:17-alpine
    restart: unless-stopped

    environment:
      POSTGRES_DB: ${POSTGRES_DB:-animals_db}
      POSTGRES_USER: ${POSTGRES_USER:-animal_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-animal_password}

    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/init.sql:/docker-entrypoint-initdb.d/init.sql:ro

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

    networks:
      - animal-net

  backend:
    build: ./backend
    restart: unless-stopped

    environment:
      PGHOST: database
      POSTGRES_DB: ${POSTGRES_DB:-animals_db}
      POSTGRES_USER: ${POSTGRES_USER:-animal_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-animal_password}
      REDIS_URL: redis://redis:6379/0

    depends_on:
      database:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy

    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:5000/health')",
        ]
      interval: 5s
      timeout: 3s
      retries: 10

    expose:
      - "5000"

    networks:
      - animal-net

  migrate:
    image: postgres:17-alpine
    restart: "no"
    environment:
      PGHOST: database
      PGDATABASE: ${POSTGRES_DB:-animals_db}
      PGUSER: ${POSTGRES_USER:-animal_user}
      PGPASSWORD: ${POSTGRES_PASSWORD:-animal_password}
    volumes:
      - ./database/init.sql:/migrations/init.sql:ro
    command:
      [
        "psql",
        "-v",
        "ON_ERROR_STOP=1",
        "--single-transaction",
        "-f",
        "/migrations/init.sql",
      ]
    depends_on:
      database:
        condition: service_healthy
    networks:
      - animal-net

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - animal-net

  nginx:
    image: nginx:alpine
    restart: unless-stopped

    ports:
      - "${HTTP_PORT:-80}:80"

    volumes:
      - ./frontend:/usr/share/nginx/html:ro
      - ./presentation:/usr/share/nginx/presentation:ro
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro

    depends_on:
      backend:
        condition: service_healthy

    networks:
      - animal-net

volumes:
  postgres_data:

networks:
  animal-net:
