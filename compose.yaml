services:
  database:
    image: postgres:17
    environment:
      POSTGRES_DB: animals_db
      POSTGRES_USER: animal_user
      POSTGRES_PASSWORD: animal_password
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U animal_user -d animals_db"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    environment:
      DATABASE_URL: postgresql://animal_user:animal_password@database:5432/animals_db
    ports:
      - "5000:5000"
    depends_on:
      database:
        condition: service_healthy

volumes:
  postgres_data:
